name: CI

# Every push and PR runs the tests and builds. Pushing a tag like v0.9.0 also publishes a
# GitHub release with the apworld and the DLL (job "release" below):
#   git tag v0.9.0 && git push origin v0.9.0
on:
  push:
  pull_request:

env:
  # Bump deliberately; see minimum_ap_version in worlds/dishonored/archipelago.json.
  ARCHIPELAGO_REF: "0.6.8"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Standalone tests
        run: |
          pip install pytest
          python tools/sync_ids.py --check
          python -m pytest -q tests

      - name: Check out Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.ARCHIPELAGO_REF }}
          path: Archipelago

      - name: World tests inside Archipelago
        working-directory: Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          pip install colorama "websockets<14" PyYAML jellyfish jinja2 schema bsdiff4 platformdirs certifi orjson typing_extensions pathspec requests Pymem pytest
          ln -s "$GITHUB_WORKSPACE/worlds/dishonored" worlds/dishonored
          python -m pytest -q worlds/dishonored/test

      - name: Build apworld
        run: python tools/build_apworld.py

      - uses: actions/upload-artifact@v4
        with:
          name: dishonored.apworld
          path: dist/dishonored.apworld

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW (32-bit)
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686

      - name: Build dinput8.dll
        working-directory: native
        run: |
          cmake --preset mingw-x86
          cmake --build --preset mingw-x86

      # Two ways to install, both into Binaries\Win32: on its own as dinput8.dll, or with
      # Dishonored Mod Loader (its dinput8.dll loads every DLL in NativeMods\).
      # The license and MinHook's notice go with every copy of the binary (BSD-2 requires it);
      # prefixed so they don't look like the game's own files in Binaries\Win32.
      - name: Stage the DLL for both installs
        run: |
          mkdir -p staging/NativeMods
          cp native/build/mingw-x86/dinput8.dll native/archipelago_native.ini staging/
          cp native/build/mingw-x86/dinput8.dll staging/NativeMods/archipelago_native.dll
          cp native/archipelago_native.ini staging/NativeMods/
          for dir in staging staging/NativeMods; do
            cp LICENSE "$dir/archipelago_native-LICENSE.txt"
            cp THIRD_PARTY_NOTICES.md "$dir/archipelago_native-THIRD_PARTY_NOTICES.txt"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-dll
          path: staging/

  # Only for version tags, and only after the tests and both builds passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release and upload its files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check the tag matches world_version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          world=$(python3 -c "import json; print(json.load(open('worlds/dishonored/archipelago.json'))['world_version'])")
          if [ "$tag" != "$world" ]; then
            echo "::error::Tag v$tag doesn't match world_version $world in worlds/dishonored/archipelago.json"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # One zip per install. Both are extracted into the game's Binaries\Win32 folder.
      - name: Package the downloads
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp artifacts/dishonored.apworld/dishonored.apworld release/
          (cd artifacts/native-dll && zip -q "../../release/dishonored-archipelago-$v-dll.zip" dinput8.dll archipelago_native.ini archipelago_native-*.txt)
          (cd artifacts/native-dll && zip -q -r "../../release/dishonored-archipelago-$v-modloader.zip" NativeMods)
          ls -l release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          notes="docs/releases/$v.md"
          if [ -f "$notes" ]; then text=(--notes-file "$notes"); else text=(--generate-notes); fi
          # 0.x versions are betas: mark them as pre-releases.
          case "$v" in 0.*) pre=(--prerelease) ;; *) pre=() ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "Dishonored Archipelago $v" "${text[@]}" "${pre[@]}"
