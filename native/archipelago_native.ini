; Settings for the Archipelago DLL. Put this next to dinput8.dll (Binaries\Win32).
; Every value is optional.

[Engine]
; Offsets from Dishonored.exe's base to the engine's name and object tables.
; These defaults were found for one build of the game (credit: ectrc/dismod).
; If the log says they failed validation, your build differs; find new ones.
GNamesOffset=0x1035674
GObjectsOffset=0x1023630
; 0 = find ProcessEvent by byte pattern (recommended)
ProcessEventOffset=0

[Commands]
; Queued console commands run on the game thread when one of these functions is
; called on a PlayerController. If commands never run, look in the call log
; for a function that fires every frame and add it here.
DrainOn=PlayerTick

[Research]
; off    = no call logging
; unique = log each distinct function once, the first time it is called
; filter = log every call whose function, object or class name contains a LogFilter word
LogCalls=off
LogFilter=Pickup,Rune,Charm,Upgrade
; In game: F8 writes a marker line to the log, F9 pauses/resumes call logging.
